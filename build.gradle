plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.144'
}

version = '1.0.0'
group = 'com.example.undoo'

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = '26.2.0.90'

    runs {
        client { client() }
        server { server() }
    }
    
    mods {
        undoo {
            sourceSet sourceSets.main
        }
    }
}
